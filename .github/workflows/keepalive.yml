name: Keep Supabase awake
on:
  schedule: [{ cron: '17 14 * * 1,4' }]   # Mondays and Thursdays
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/keepalive.mjs
